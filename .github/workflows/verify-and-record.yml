name: Verify and Record Results

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest
          req_file=$(find . -iname "requirements.txt" -print -quit)
          if [ -n "$req_file" ]; then
            echo "Found requirements at: $req_file"
            pip install -r "$req_file"
          else
            echo "No requirements.txt found — continuing with stdlib only."
          fi
      - name: Run tests
        run: pytest -q || echo "TEST_FAILURES=1" >> $GITHUB_ENV
      - name: Run example and capture output
        run: |
          mkdir -p results
          example_file=$(find . -path ./node_modules -prune -o -iname "*.py" -path "*example*" -print -quit)
          if [ -z "$example_file" ]; then
            example_file=$(find . -path ./node_modules -prune -o -iname "*.py" -path "*demo*" -print -quit)
          fi
          if [ -n "$example_file" ]; then
            python "$example_file" > results/last_run_output.txt 2>&1 || echo "(example run failed — see log above)" >> results/last_run_output.txt
          else
            echo "No example/demo script found." > results/last_run_output.txt
          fi
          echo "" >> results/last_run_output.txt
          echo "Recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> results/last_run_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          git diff --staged --quiet || git commit -m "chore: record verified run output"
          git push || true
